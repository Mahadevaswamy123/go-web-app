name: Go-web-app
on: 
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'README.md'
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup the go
        uses: actions/setup-go@v2
        with:
          go-version: 1.25

      - name: build 
        run: go build -o main
      - name: Test
        run: go test ./...

        
    
